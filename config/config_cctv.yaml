# Configuration optimized for CCTV/Surveillance footage (no audio)

# Video processing settings
video_processing:
  input_path: "data/test_sample4.mp4"
  frame_extraction_fps: 15  # Lower FPS for surveillance (1 frame every 2 seconds)
  chunk_duration_seconds: 60  # Longer chunks for surveillance
  overlap_seconds: 10
  supported_formats: [mp4, avi, mov, mkv]
  # Image optimization settings
  resize_dimensions: [640, 480]  # Width x Height - smaller for faster processing
  jpeg_quality: 85  # Compression quality (0-100)
  
# Audio processing - DISABLED for CCTV
audio_processing:
  enabled: false  # Disable audio processing for surveillance footage
  output_path: "cache/audio.mp3"
  whisper_model_size: "small"
  transcript_output_path: "cache/transcript.txt"
  # Audio detection settings
  min_audio_duration: 1.0
  silence_threshold: -40

# VLM settings - Optimized for surveillance analysis
vlm:
  # Model type: "ollama", "blip", or "florence2"
  model_type: "florence2"  # Florence-2 better for detailed scene analysis
  
  # Ollama settings
  model_name: "gemma3:4b"
  temperature: 0
  
  # HuggingFace model settings (when model_type is "blip" or "florence2")
  huggingface:
    device: "auto"  # "cuda", "cpu", or "auto"
    
    # BLIP settings
    blip_model: "Salesforce/blip-image-captioning-large"
    blip_max_length: 50
    
    # Florence-2 settings - Detailed analysis for surveillance
    florence2_model: "microsoft/Florence-2-large"
    florence2_task: "<DETAILED_CAPTION>"  # Detailed analysis for security footage
  
  # Processing settings
  importance_threshold: 0.4  # Lower threshold to catch more events in surveillance
  batch_size: 4
  context_frames: 3

# Cache settings
cache:
  directory: "cache"
  frames_directory: "cache/frames"
  metadata_directory: "cache/metadata"
  
# Vector store settings
vector_store:
  uri: "./milvus_video.db"
  index_type: "FLAT"
  metric_type: "L2"
  
# Object tracking settings - IMPORTANT for surveillance
object_tracking:
  enabled: true
  detection_model: "yolo11"
  model_size: "n"  # Medium model for balance of speed/accuracy
  confidence_threshold: 0.4  # Lower threshold to catch more objects
  tracking_algorithm: "deepsort"
  max_tracks_per_frame: 100  # More tracks for busy surveillance scenes
  track_classes: ["person", "car", "truck", "bus", "bicycle", "motorbike", "backpack", "handbag", "suitcase"]  # Security-relevant objects
  
# Graph database settings
graph_database:
  enabled: true
  type: "networkx"
  # Neo4j settings (if using neo4j)
  neo4j_uri: "bolt://localhost:7687"
  neo4j_user: "neo4j"
  neo4j_password: "password"
  
# Memory settings
memory:
  session_retention_hours: 48  # Longer retention for surveillance reviews
  max_conversation_history: 200  # More history for detailed analysis
  enable_cross_session_memory: true